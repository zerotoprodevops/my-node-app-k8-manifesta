apiVersion: apps/v1


kind: Deployment


metadata:
  name: node-app-depoyment

spec:
  replicas: 0
  selector:
    matchLabels:
      app: node-app
      type: frontend  
  template:
    metadata:
      name: my-node-app
      labels:  
        app: node-app
        type: frontend
    spec:
      containers:
        - name: nodeapp-container
          image: jyotimanab/my-node-app:23
          ports:  
            - containerPort: 3000
